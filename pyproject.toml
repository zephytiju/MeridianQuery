# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-storage-query"
version = "1.0.1"
description = "Engine-neutral query AST, validation, planning, and cursor contracts for Meridian Storage"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Meridian contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "meridian-storage-core==1.0.1",
  "meridian-storage-semantics==2.0.0",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "hatchling==1.27.0",
  "hypothesis>=6.135,<7",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianQuery#readme"
Issues = "https://github.com/zephytiju/MeridianQuery/issues"
Repository = "https://github.com/zephytiju/MeridianQuery"

[tool.hatch.build]
include = [
  "src/meridian_storage/query/**",
  "contracts/**",
  "docs/**",
  "compatibility.json",
  "LICENSE",
  "NOTICE",
  "README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "meridian_storage/query/contracts"
"compatibility.json" = "meridian_storage/query/compatibility.json"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/contracts",
  "/docs",
  "/scripts",
  "/.github",
  "/compatibility.json",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "contract: canonical wire contract tests",
  "conformance: adapter-facing conformance tests",
  "integration: released Core and Semantics integration",
  "packaging: built artifact verification",
  "property: generative deterministic contract tests",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage.query"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_storage.query"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

