# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or repair
        required: true
        type: string
      publish_pypi:
        description: Publish the rebuilt distributions to PyPI
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source and main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag, version, and main ancestry
        run: |
          python scripts/check_version.py "${RELEASE_TAG}"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Install released dependencies and release tools
        run: python -m pip install '.[test]'
      - name: Run complete verification
        run: |
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy src
          python -m pytest --cov=meridian_storage.query --cov-report=term-missing
      - name: Build deterministic artifacts
        run: bash scripts/build_reproducible.sh
      - name: Verify clean installed-package regressions
        run: bash scripts/verify_installed.sh
      - name: Write checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/meridian-storage-query.spdx.json
      - name: Attest distribution provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            dist/SHA256SUMS
            dist/*.spdx.json
          if-no-files-found: error

  github-release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence
          path: dist
      - name: Create or verify immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            mkdir published-release
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir published-release
            for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS; do
              cmp "${artifact}" "published-release/$(basename "${artifact}")"
            done
            jq --sort-keys 'del(.documentNamespace, .creationInfo)' \
              dist/meridian-storage-query.spdx.json > built-sbom.json
            jq --sort-keys 'del(.documentNamespace, .creationInfo)' \
              published-release/meridian-storage-query.spdx.json > published-sbom.json
            diff --brief built-sbom.json published-sbom.json
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes
          fi

  publish-pypi:
    name: publish PyPI with OIDC
    if: >-
      (github.event_name == 'push' && vars.PYPI_TRUSTED_PUBLISHING_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meridian-storage-query/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
